# DPDP Act 2023 & DPDP Rules 2025 - Legal Status Registry
# As of Reference Date: 2026-11-05
# Central machine-readable source of truth for phased enforcement.

metadata:
  primary_statute: "The Digital Personal Data Protection Act, 2023"
  act_number: "Act No. 22 of 2023"
  assent_date: "2023-08-11"
